site_name: Twin2MultiCloud Documentation
site_description: Canonical user and developer documentation for Twin2MultiCloud.
repo_url: https://github.com/TVJunkie724/master-thesis
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_javascript:
  - javascripts/external-links.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Quickstart: getting-started/fresh-clone.md
  - Walkthrough: user-guide/multi-cloud-walkthrough.md
  - Results and Limits: runtime/known-limitations.md
  - User Guide:
      - user-guide/index.md
      - Sign In: user-guide/sign-in.md
      - Dashboard and Twins: user-guide/dashboard-and-twins.md
