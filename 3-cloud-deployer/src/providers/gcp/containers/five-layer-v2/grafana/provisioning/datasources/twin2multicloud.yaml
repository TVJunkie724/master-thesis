apiVersion: 1

deleteDatasources:
  - name: Twin2MultiCloud Raw History
    orgId: 1

datasources:
  - name: Twin2MultiCloud Raw History
    uid: twin2multicloud-raw-history
    type: yesoreyeram-infinity-datasource
    access: proxy
    orgId: 1
    isDefault: true
    editable: false
    url: ${RAW_HISTORY_READER_URL}
    jsonData:
      auth_method: apiKey
      apiKeyKey: x-twin2multicloud-reader-key
      apiKeyType: header
      allowedHosts:
        - ${RAW_HISTORY_READER_URL}
      timeoutInSeconds: 10
      customHealthCheckEnabled: true
      customHealthCheckUrl: ${RAW_HISTORY_READER_URL}/healthz
      allowDangerousHTTPMethods: false
    secureJsonData:
      apiKeyValue: ${RAW_HISTORY_READER_KEY}
